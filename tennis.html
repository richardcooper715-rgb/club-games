<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tennis Match Selection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8eef3; --surface:#fbfcfd; --ink:#15283a; --muted:#516476; --line:#c8d4de;
  --main:#2b5d86; --main-2:#24507a; --on-main:#ffffff; --main-soft:#dbe7f1;
  --surround:#3f7f55; --ball:#d4e138; --warn:#9b3b22;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f151b; --surface:#172029; --ink:#e6edf3; --muted:#9caebe; --line:#2b3947;
    --main:#4f8fc4; --main-2:#5c9bd0; --on-main:#0b1520; --main-soft:#1d2e3e;
    --surround:#346b47; --ball:#dfe95a; --warn:#ef8a6c;
  }
}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#172029; --ink:#e6edf3; --muted:#9caebe; --line:#2b3947;
  --main:#4f8fc4; --main-2:#5c9bd0; --on-main:#0b1520; --main-soft:#1d2e3e;
  --surround:#346b47; --ball:#dfe95a; --warn:#ef8a6c;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:17px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1,h2{font-family:Bitter,Georgia,"Times New Roman",serif;margin:0;line-height:1.15}
h1{font-size:clamp(1.7rem,5vw,2.3rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.3rem;font-weight:600;margin-bottom:4px}
.sub{color:var(--muted);margin:6px 0 0}
header{margin-bottom:18px}

.steps{display:flex;gap:6px;list-style:none;margin:0 0 18px;padding:0}
.steps li{flex:1;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;
  background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:.92rem}
.steps li b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;
  background:var(--line);color:var(--ink);font-size:.85rem;flex:none}
.steps li.on{border-color:var(--main);color:var(--ink);font-weight:700}
.steps li.on b{background:var(--main);color:var(--on-main)}
.steps li.done b{background:var(--main-soft);color:var(--main)}
@media (max-width:460px){.steps li span{display:none}.steps li{justify-content:center}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.panel[hidden]{display:none}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:14px 0}
.count{font-weight:700}

/* players: name line, then preference line */
.prow{padding:10px 2px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.ptop{display:flex;align-items:center;gap:10px}
.pname{display:flex;align-items:center;gap:12px;cursor:pointer;min-width:0;flex:1;font-weight:700}
.pname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prefs{display:grid;grid-template-columns:70px repeat(3,1fr);gap:8px;margin:8px 0 0 36px}
@media (max-width:520px){.prefs{grid-template-columns:1fr 1fr;margin-left:0}}
.prow.off .pname span{color:var(--muted);font-weight:400}
.prow.off .prefs{display:none}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--main);flex:none;margin:0;cursor:pointer}
select,input[type=text]{font:inherit;font-size:.98rem;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:9px;padding:7px 8px;width:100%;min-height:42px}
.x{width:40px;height:40px;border-radius:9px;border:1px solid transparent;background:none;color:var(--muted);
  font-size:1.4rem;cursor:pointer;line-height:1;flex:none}
.x:hover{border-color:var(--line);color:var(--warn)}
.add{display:flex;gap:8px;margin-top:12px}
.add input{flex:1}
.add select{width:80px;flex:none}

button.btn{font:inherit;font-weight:700;border-radius:11px;padding:11px 18px;cursor:pointer;min-height:46px;
  border:1.5px solid var(--main);background:var(--main);color:var(--on-main)}
button.btn:hover{background:var(--main-2)}
button.btn.ghost{background:transparent;color:var(--main)}
button.btn.ghost:hover{background:var(--main-soft)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button.link{font:inherit;background:none;border:0;color:var(--main);text-decoration:underline;cursor:pointer;padding:4px}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.nav .right{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}

.opts{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin:12px 0 16px;color:var(--muted)}
.opts label{display:flex;align-items:center;gap:8px;cursor:pointer}
.opts select{width:auto}
.combos{display:grid;gap:10px}
.combo{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface)}
.combo.sel{border-color:var(--main);background:var(--main-soft)}
.combo input{margin-top:2px}
.combo .what{font-weight:700;font-size:1.05rem}
.combo .meta{color:var(--muted);font-size:.93rem;margin-top:2px}
.combo .pref{font-size:.93rem;margin-top:4px}
.badge{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:20px;background:var(--ball);color:#262a00;font-size:.78rem;font-weight:700;vertical-align:2px}
.empty{padding:16px;border:1.5px dashed var(--line);border-radius:12px;color:var(--muted)}

/* courts: each match drawn as a court with a net down the middle */
.courts{display:grid;gap:16px}
.court{border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.court-head{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surface)}
.court-no{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 8px;border-radius:50%;background:var(--ball);color:#262a00;font-family:Bitter,Georgia,serif;font-weight:800;margin-right:10px}
.court-head strong{font-size:1.1rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.82rem;padding:2px 9px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
.surface{padding:10px;background:var(--surround)}
.playarea{display:grid;grid-template-columns:1fr 10px 1fr;gap:10px;align-items:stretch;padding:14px 12px;
  background:var(--main);border:2px solid rgba(255,255,255,.85);border-radius:3px}
.net{background:repeating-linear-gradient(180deg,rgba(255,255,255,.95) 0 3px,rgba(20,30,40,.55) 3px 6px);border-radius:2px}
.team{background:rgba(255,255,255,.95);color:#15283a;border-radius:10px;padding:10px 12px;min-width:0}
.team h3{margin:0 0 4px;font-size:.85rem;font-weight:700;opacity:.7}
.team ol{margin:0;padding:0;list-style:none}
.team li{padding:2px 0;font-weight:700;overflow-wrap:anywhere}
.team li .star{color:#8a7400;font-weight:400}
.notes{margin-top:16px;display:grid;gap:8px}
.note{padding:10px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:.95rem}
.note.warn{border-color:var(--warn)}
.legend{color:var(--muted);font-size:.9rem;margin-top:10px}
.fresh{animation:pop .35s ease-out}
@keyframes pop{from{opacity:.2;transform:scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fresh{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
footer{color:var(--muted);font-size:.85rem;margin-top:18px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Tennis match selection</h1>
    <p class="sub" id="today"></p>
  </header>

  <ol class="steps" aria-label="Progress">
    <li data-s="1"><b>1</b><span>Who's playing</span></li>
    <li data-s="2"><b>2</b><span>Choose matches</span></li>
    <li data-s="3"><b>3</b><span>The draw</span></li>
  </ol>

  <!-- STEP 1 -->
  <section class="panel" id="step1">
    <h2>Who's playing today?</h2>
    <p class="sub">Tick everyone who's here, then set any preferences under their name.</p>
    <div class="bar">
      <span class="count" id="count1"></span>
      <span><button class="link" id="allOn">Tick all</button> <button class="link" id="allOff">Untick all</button></span>
    </div>
    <div id="players"></div>
    <form class="add" onsubmit="return false">
      <input type="text" id="newName" placeholder="Add a player" aria-label="New player name" maxlength="40">
      <select id="newG" aria-label="New player is a man or woman"><option value="M">Man</option><option value="W">Woman</option></select>
      <button class="btn ghost" id="addBtn" type="button">Add</button>
    </form>
    <div class="nav">
      <button class="link" id="resetList">Restore the regulars</button>
      <div class="right"><button class="btn" id="to2">Show match options</button></div>
    </div>
  </section>

  <!-- STEP 2 -->
  <section class="panel" id="step2" hidden>
    <h2>Choose the matches</h2>
    <p class="sub" id="sum2"></p>
    <div class="opts">
      <label>Courts available
        <select id="maxCourts">
          <option value="0">Any number</option>
          <option value="1">1</option><option value="2">2</option><option value="3">3</option>
          <option value="4">4</option><option value="5">5</option><option value="6">6</option>
        </select>
      </label>
      <label><input type="checkbox" id="allowSit"> Allow some players to sit out</label>
    </div>
    <div class="combos" id="combos" aria-label="Match combinations"></div>
    <div class="nav">
      <button class="btn ghost" id="back1">Back</button>
      <div class="right"><button class="btn" id="to3" disabled>Make the draw</button></div>
    </div>
  </section>

  <!-- STEP 3 -->
  <section class="panel" id="step3" hidden>
    <h2>Today's draw</h2>
    <p class="sub" id="sum3"></p>
    <div class="courts" id="courts" style="margin-top:14px"></div>
    <p class="legend">★ got all of their preferences</p>
    <div class="notes" id="notes"></div>
    <div class="nav">
      <button class="btn ghost" id="back2">Back</button>
      <div class="right">
        <button class="btn ghost" id="copyBtn">Copy draw</button>
        <button class="btn" id="redraw">Reselect</button>
      </div>
    </div>
  </section>

  <footer>Your player list is remembered on this device.</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var KEY='tennis-players-v1';
  var DEFAULT=[["Richard","M"],["Jamie","M"],["Brian P","M"],["Brian S","M"],["Michael","M"],["Terry","M"],
    ["Linda","W"],["Claire","W"],["Gresh","M"],["Sarah","W"],["Chris","M"],["Gillian","W"],
    ["Viv","W"],["Ros","W"],["Rosemary","W"],["Marie-Carmen","W"]];
  var FMT={D:"Doubles",S:"Singles",E:"Either format"};
  var MIX={E:"Any mix",X:"Mixed",S:"Men's / women's"};
  var PACE={E:"Any pace",G:"Gentle",C:"Competitive"};
  var $=function(s){return document.querySelector(s)};

  function mk(n,g){return {name:n,g:g,playing:true,fmt:'D',mix:'E',pace:'E'}}
  function defaults(){return DEFAULT.map(function(d){return mk(d[0],d[1])})}
  function load(){
    try{var s=localStorage.getItem(KEY);if(s){var p=JSON.parse(s);if(Array.isArray(p)&&p.length)return p;}}catch(e){}
    return defaults();
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(players))}catch(e){}}

  var players=load(), combos=[], chosenKey=null, seen={}, lastDraw=null;
  var dateStr=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  $('#today').textContent=dateStr;

  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function plural(n,w){return n+' '+w+(n===1?'':'s')}
  function playing(){return players.filter(function(p){return p.playing})}
  function names(l){return l.map(function(p){return p.name})}

  function go(s){
    [1,2,3].forEach(function(i){$('#step'+i).hidden=(i!==s)});
    document.querySelectorAll('.steps li').forEach(function(li){var n=+li.dataset.s;li.className=n===s?'on':(n<s?'done':'')});
    if(s===2)renderCombos();
    if(s===3)makeDraw(true);
    window.scrollTo({top:0,behavior:'smooth'});
  }

  /* ---------- step 1 ---------- */
  function mkSelect(opts,val,label,onch){
    var sel=document.createElement('select');sel.setAttribute('aria-label',label);
    Object.keys(opts).forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=opts[k];if(k===val)o.selected=true;sel.appendChild(o)});
    sel.onchange=function(){onch(sel.value);save()};return sel;
  }
  function renderPlayers(){
    var box=$('#players');box.innerHTML='';
    players.forEach(function(p,i){
      var row=document.createElement('div');row.className='prow'+(p.playing?'':' off');
      var top=document.createElement('div');top.className='ptop';
      var lab=document.createElement('label');lab.className='pname';
      var cb=document.createElement('input');cb.type='checkbox';cb.checked=p.playing;cb.setAttribute('aria-label',p.name+' is playing');
      var sp=document.createElement('span');sp.textContent=p.name;
      lab.appendChild(cb);lab.appendChild(sp);
      var x=document.createElement('button');x.className='x';x.type='button';x.textContent='×';
      x.title='Remove '+p.name+' from the group';x.setAttribute('aria-label','Remove '+p.name);
      cb.onchange=function(){p.playing=cb.checked;row.className='prow'+(p.playing?'':' off');save();updateCount()};
      x.onclick=function(){players.splice(i,1);save();renderPlayers()};
      top.appendChild(lab);top.appendChild(x);
      var pr=document.createElement('div');pr.className='prefs';
      pr.appendChild(mkSelect({M:"Man",W:"Woman"},p.g,p.name+': man or woman',function(v){p.g=v}));
      pr.appendChild(mkSelect(FMT,p.fmt,p.name+': singles or doubles',function(v){p.fmt=v}));
      pr.appendChild(mkSelect(MIX,p.mix,p.name+': mixed or not',function(v){p.mix=v}));
      pr.appendChild(mkSelect(PACE,p.pace,p.name+': gentle or competitive',function(v){p.pace=v}));
      row.appendChild(top);row.appendChild(pr);box.appendChild(row);
    });
    updateCount();
  }
  function updateCount(){
    var pl=playing(),m=pl.filter(function(p){return p.g==='M'}).length;
    $('#count1').textContent=plural(pl.length,'player')+' ticked ('+m+' men, '+(pl.length-m)+' women)';
    $('#to2').disabled=pl.length<2;
  }
  function addPlayer(){
    var v=$('#newName').value.trim();if(!v)return;
    players.push(mk(v,$('#newG').value));$('#newName').value='';save();renderPlayers();$('#newName').focus();
  }
  $('#addBtn').onclick=addPlayer;
  $('#newName').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();addPlayer()}});
  $('#allOn').onclick=function(){players.forEach(function(p){p.playing=true});save();renderPlayers()};
  $('#allOff').onclick=function(){players.forEach(function(p){p.playing=false});save();renderPlayers()};
  $('#resetList').onclick=function(){players=defaults();save();renderPlayers()};
  $('#to2').onclick=function(){go(2)};

  /* ---------- step 2 ---------- */
  function buildCombos(){
    var pl=playing(),N=pl.length;
    var wantD=pl.filter(function(p){return p.fmt==='D'}).length, wantS=pl.filter(function(p){return p.fmt==='S'}).length;
    var allow=$('#allowSit').checked, maxC=+$('#maxCourts').value||99;
    var maxSit=allow?Math.min(3,N-2):(N%2);
    var list=[];
    for(var k=0;k<=maxSit;k++){
      var used=N-k;if(used<2||used%2)continue;
      for(var d=Math.floor(used/4);d>=0;d--){
        var s=(used-4*d)/2;if(d+s>maxC)continue;
        list.push({key:d+'-'+s+'/'+k,d:d,s:s,sit:k,used:used,courts:d+s,
          met:Math.min(wantD,4*d)+Math.min(wantS,2*s),wanted:wantD+wantS});
      }
    }
    list.sort(function(a,b){return a.sit-b.sit||b.met-a.met||a.courts-b.courts});
    return list;
  }
  function comboName(c){
    var parts=[];if(c.d)parts.push(c.d+' × Doubles');if(c.s)parts.push(c.s+' × Singles');return parts.join(' + ');
  }
  function renderCombos(){
    var pl=playing(),N=pl.length,wd=pl.filter(function(p){return p.fmt==='D'}).length,ws=pl.filter(function(p){return p.fmt==='S'}).length;
    var bits=[];if(wd)bits.push(wd+' want doubles');if(ws)bits.push(ws+' want singles');
    $('#sum2').textContent=plural(N,'player')+' today'+(bits.length?' ('+bits.join(', ')+')':'')+'. Tick the set of matches you want.';
    combos=buildCombos();
    var box=$('#combos');box.innerHTML='';
    if(!combos.length){
      var e=document.createElement('div');e.className='empty';
      e.textContent='No combinations fit. Try allowing more courts or letting some players sit out.';
      box.appendChild(e);chosenKey=null;$('#to3').disabled=true;return;
    }
    if(!combos.some(function(c){return c.key===chosenKey}))chosenKey=null;
    combos.forEach(function(c,i){
      var lab=document.createElement('label');lab.className='combo'+(c.key===chosenKey?' sel':'');
      var r=document.createElement('input');r.type='checkbox';r.checked=c.key===chosenKey;
      var d=document.createElement('div');
      var w=document.createElement('div');w.className='what';w.textContent=comboName(c);
      if(i===0&&c.wanted>0){var b=document.createElement('span');b.className='badge';b.textContent='Best fit';w.appendChild(b)}
      var m=document.createElement('div');m.className='meta';
      m.textContent=plural(c.courts,'court')+', '+(c.sit?c.used+' play and '+c.sit+' sit'+(c.sit===1?'s':'')+' out':'everyone plays');
      d.appendChild(w);d.appendChild(m);
      if(c.wanted){var pf=document.createElement('div');pf.className='pref';pf.textContent='Singles/doubles preferences met: '+c.met+' of '+c.wanted;d.appendChild(pf)}
      r.onchange=function(){chosenKey=r.checked?c.key:null;renderCombos()};
      lab.appendChild(r);lab.appendChild(d);box.appendChild(lab);
    });
    $('#to3').disabled=!chosenKey;
  }
  $('#maxCourts').onchange=renderCombos;
  $('#allowSit').onchange=renderCombos;
  $('#back1').onclick=function(){go(1)};
  $('#to3').onclick=function(){if(chosenKey){seen={};go(3)}};

  /* ---------- step 3: the draw ---------- */
  // what kind of match this turned out to be
  function category(m){
    var all=m.a.concat(m.b),men=all.filter(function(p){return p.g==='M'}).length;
    if(m.type==='S')return men===1?'mixed':'same';
    var aMen=m.a.filter(function(p){return p.g==='M'}).length,bMen=m.b.filter(function(p){return p.g==='M'}).length;
    if(aMen===1&&bMen===1)return 'mixed';
    if(men===0||men===4)return 'same';
    return 'other';
  }
  // returns penalty and, per player, which preferences were missed
  function judge(m){
    var all=m.a.concat(m.b),cat=category(m),pen=0,miss=[];
    var hasG=all.some(function(p){return p.pace==='G'}),hasC=all.some(function(p){return p.pace==='C'});
    all.forEach(function(p){
      var why=[];
      if(p.fmt==='D'&&m.type==='S'){pen+=10;why.push('doubles')}
      if(p.fmt==='S'&&m.type==='D'){pen+=10;why.push('singles')}
      if(p.mix==='X'&&cat!=='mixed'){pen+=4;why.push('mixed')}
      if(p.mix==='S'&&cat!=='same'){pen+=4;why.push(p.g==='M'?"men's":"women's")}
      if(p.pace==='G'&&hasC){pen+=3;why.push('gentle')}
      if(p.pace==='C'&&hasG){pen+=3;why.push('competitive')}
      if(why.length)miss.push({p:p,why:why});
    });
    return {pen:pen,miss:miss};
  }
  function bestPairing(four){
    var opts=shuffle([[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]]),best=null;
    opts.forEach(function(o){
      var m={type:'D',a:[four[o[0][0]],four[o[0][1]]],b:[four[o[1][0]],four[o[1][1]]]};
      var j=judge(m);
      // in a 2-men/2-women match, never put the men against the women
      if(category(m)==='other'&&four.filter(function(p){return p.g==='M'}).length===2)j.pen+=5;
      if(!best||j.pen<best.pen)best={m:m,pen:j.pen};
    });
    return best.m;
  }
  function candidate(pl,c){
    var capS=2*c.s,capD=4*c.d,S=[],D=[],rest=[];
    shuffle(pl).forEach(function(p){
      if(p.fmt==='S'&&S.length<capS)S.push(p);
      else if(p.fmt==='D'&&D.length<capD)D.push(p);
      else rest.push(p);
    });
    var free=[];for(var i=S.length;i<capS;i++)free.push('S');for(i=D.length;i<capD;i++)free.push('D');
    free=shuffle(free);
    shuffle(rest).forEach(function(p,i){(free[i]==='S'?S:D).push(p)});
    var matches=[];
    S=shuffle(S);D=shuffle(D);
    for(i=0;i<c.s;i++)matches.push({type:'S',a:[S[2*i]],b:[S[2*i+1]]});
    for(i=0;i<c.d;i++)matches.push(bestPairing(D.slice(4*i,4*i+4)));
    var pen=0,miss=[];
    matches.forEach(function(m){var j=judge(m);pen+=j.pen;miss=miss.concat(j.miss)});
    return {matches:matches,pen:pen,miss:miss};
  }
  function sig(d){
    return d.matches.map(function(m){
      var a=names(m.a).sort().join('&'),b=names(m.b).sort().join('&');return m.type+':'+[a,b].sort().join('|');
    }).sort().join(';');
  }
  function makeDraw(first){
    var c=combos.find(function(x){return x.key===chosenKey});if(!c)return go(2);
    // anyone sitting out is picked purely at random, before preferences are considered
    var pl=shuffle(playing()),sitting=pl.slice(0,c.sit),inPlay=pl.slice(c.sit);
    var pool={};
    for(var t=0;t<3000;t++){var d=candidate(inPlay,c),s=sig(d);if(!pool[s])pool[s]=d}
    var keys=Object.keys(pool);
    var fresh=keys.filter(function(k){return !seen[k]});
    if(!fresh.length){seen={};fresh=keys}
    var min=Math.min.apply(null,fresh.map(function(k){return pool[k].pen}));
    var best=fresh.filter(function(k){return pool[k].pen===min});
    var pick=best[Math.floor(Math.random()*best.length)];
    seen[pick]=true;
    var draw=pool[pick];draw.matches=shuffle(draw.matches);draw.sitting=sitting;
    lastDraw=draw;renderDraw(draw,c,!first);
  }
  function catLabel(m){
    var cat=category(m),kind=m.type==='S'?'singles':'doubles';
    if(cat==='mixed')return 'Mixed '+kind;
    if(cat==='same')return (m.a[0].g==='M'?"Men's ":"Women's ")+kind;
    return 'Doubles';
  }
  function paceLabel(m){
    var all=m.a.concat(m.b),g=all.some(function(p){return p.pace==='G'}),c=all.some(function(p){return p.pace==='C'});
    return g&&c?'Mixed pace':g?'Gentle':c?'Competitive':'';
  }
  function teamBox(label,list,missed){
    var t=document.createElement('div');t.className='team';
    var h=document.createElement('h3');h.textContent=label;t.appendChild(h);
    var ol=document.createElement('ol');
    list.forEach(function(p){
      var li=document.createElement('li');li.textContent=p.name;
      var hasPref=p.fmt!=='E'||p.mix!=='E'||p.pace!=='E';
      if(hasPref&&!missed[p.name]){var s=document.createElement('span');s.className='star';s.textContent=' ★';s.setAttribute('aria-label','got all preferences');li.appendChild(s)}
      ol.appendChild(li);
    });
    t.appendChild(ol);return t;
  }
  function renderDraw(d,c,animate){
    $('#sum3').textContent=comboName(c)+'. Not happy? Press Reselect for a fresh draw.';
    var missed={};d.miss.forEach(function(x){missed[x.p.name]=x.why});
    var box=$('#courts');box.innerHTML='';
    d.matches.forEach(function(m,i){
      var r=document.createElement('div');r.className='court'+(animate?' fresh':'');
      var h=document.createElement('div');h.className='court-head';
      var l=document.createElement('div');
      var no=document.createElement('span');no.className='court-no';no.textContent=i+1;
      var st=document.createElement('strong');st.textContent=catLabel(m);
      l.appendChild(no);l.appendChild(st);h.appendChild(l);
      var pl=paceLabel(m);
      if(pl){var chips=document.createElement('div');chips.className='chips';var ch=document.createElement('span');ch.className='chip';ch.textContent=pl;chips.appendChild(ch);h.appendChild(chips)}
      var sf=document.createElement('div');sf.className='surface';
      var pa=document.createElement('div');pa.className='playarea';
      pa.appendChild(teamBox(m.type==='S'?'Player A':'Pair A',m.a,missed));
      var net=document.createElement('div');net.className='net';net.setAttribute('aria-hidden','true');pa.appendChild(net);
      pa.appendChild(teamBox(m.type==='S'?'Player B':'Pair B',m.b,missed));
      sf.appendChild(pa);r.appendChild(h);r.appendChild(sf);box.appendChild(r);
    });
    var n=$('#notes');n.innerHTML='';
    if(d.sitting.length){
      var s=document.createElement('div');s.className='note';s.textContent='Sitting out: '+names(d.sitting).join(', ');n.appendChild(s);
    }
    if(d.miss.length){
      var u=document.createElement('div');u.className='note warn';
      u.textContent='Preferences not met this time: '+d.miss.map(function(x){return x.p.name+' (wanted '+x.why.join(', ')+')'}).join('; ');
      n.appendChild(u);
    }
  }
  function drawText(){
    if(!lastDraw)return '';
    var lines=['Tennis \u2013 '+dateStr,''];
    lastDraw.matches.forEach(function(m,i){
      lines.push('Court '+(i+1)+' \u2013 '+catLabel(m)+(paceLabel(m)?' ('+paceLabel(m).toLowerCase()+')':''));
      lines.push('  '+names(m.a).join(' & ')+'  v  '+names(m.b).join(' & '));
      lines.push('');
    });
    if(lastDraw.sitting.length)lines.push('Sitting out: '+names(lastDraw.sitting).join(', '));
    return lines.join('\n').trim();
  }
  function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1800)}
  $('#copyBtn').onclick=function(){
    var txt=drawText();
    function fallback(){
      try{var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);toast(ok?'Draw copied':'Copy didn\u2019t work on this device')}
      catch(e){toast('Copy didn\u2019t work on this device')}
    }
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('Draw copied')},fallback)}else fallback()}
    catch(e){fallback()}
  };
  $('#redraw').onclick=function(){makeDraw(false)};
  $('#back2').onclick=function(){go(2)};

  renderPlayers();go(1);
})();
</script>
