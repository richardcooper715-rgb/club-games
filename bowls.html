<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bowls Team Selection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9f0e4; --surface:#fbfdf8; --ink:#16301f; --muted:#506356; --line:#c9d6c3;
  --turf:#2e6b3c; --turf-2:#3a7d49; --on-turf:#ffffff; --turf-soft:#dcebd8;
  --marker:#e2b20c; --teamB:#5a3326; --teamB-soft:#f1e3dc; --warn:#9b3b22;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101712; --surface:#18221b; --ink:#e7efe5; --muted:#9db0a1; --line:#2c3b30;
    --turf:#2f6a3c; --turf-2:#367646; --on-turf:#ffffff; --turf-soft:#1f3326;
    --marker:#efc531; --teamB:#d9a68f; --teamB-soft:#33241e; --warn:#ef8a6c;
  }
}
:root[data-theme="dark"]{
  --bg:#101712; --surface:#18221b; --ink:#e7efe5; --muted:#9db0a1; --line:#2c3b30;
  --turf:#2f6a3c; --turf-2:#367646; --on-turf:#ffffff; --turf-soft:#1f3326;
  --marker:#efc531; --teamB:#d9a68f; --teamB-soft:#33241e; --warn:#ef8a6c;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:17px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1,h2{font-family:Bitter,Georgia,"Times New Roman",serif;margin:0;line-height:1.15}
h1{font-size:clamp(1.7rem,5vw,2.3rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.3rem;font-weight:600;margin-bottom:4px}
.sub{color:var(--muted);margin:6px 0 0}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}

/* stepper */
.steps{display:flex;gap:6px;list-style:none;margin:0 0 18px;padding:0}
.steps li{flex:1;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;
  background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:.92rem}
.steps li b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;
  background:var(--line);color:var(--ink);font-size:.85rem;flex:none}
.steps li.on{border-color:var(--turf);color:var(--ink);font-weight:700}
.steps li.on b{background:var(--turf);color:var(--on-turf)}
.steps li.done b{background:var(--turf-soft);color:var(--turf)}
@media (max-width:460px){.steps li span{display:none}.steps li{justify-content:center}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.panel[hidden]{display:none}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:14px 0}
.count{font-weight:700}

/* players */
.prow{display:grid;grid-template-columns:1fr minmax(130px,170px) 40px;gap:10px;align-items:center;
  padding:9px 2px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.pname{display:flex;align-items:center;gap:12px;cursor:pointer;min-width:0}
.pname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow.off .pname span{color:var(--muted)}
.prow.off select{opacity:.4}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--turf);flex:none;margin:0;cursor:pointer}
select,input[type=text]{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-height:42px}
.x{width:40px;height:40px;border-radius:9px;border:1px solid transparent;background:none;color:var(--muted);
  font-size:1.4rem;cursor:pointer;line-height:1}
.x:hover{border-color:var(--line);color:var(--warn)}
.add{display:flex;gap:8px;margin-top:12px}
.add input{flex:1}

button.btn{font:inherit;font-weight:700;border-radius:11px;padding:11px 18px;cursor:pointer;min-height:46px;
  border:1.5px solid var(--turf);background:var(--turf);color:var(--on-turf)}
button.btn:hover{background:var(--turf-2)}
button.btn.ghost{background:transparent;color:var(--turf)}
button.btn.ghost:hover{background:var(--turf-soft)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button.link{font:inherit;background:none;border:0;color:var(--turf);text-decoration:underline;cursor:pointer;padding:4px}
:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.nav .right{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}

/* combos */
.opts{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin:12px 0 16px;color:var(--muted)}
.opts label{display:flex;align-items:center;gap:8px;cursor:pointer}
.opts select{width:auto}
.combos{display:grid;gap:10px}
.combo{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface)}
.combo.sel{border-color:var(--turf);background:var(--turf-soft)}
.combo input{margin-top:2px}
.combo .what{font-weight:700;font-size:1.05rem}
.combo .meta{color:var(--muted);font-size:.93rem;margin-top:2px}
.combo .pref{font-size:.93rem;margin-top:4px}
.badge{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:20px;background:var(--marker);color:#2a2100;font-size:.78rem;font-weight:700;vertical-align:2px}
.empty{padding:16px;border:1.5px dashed var(--line);border-radius:12px;color:var(--muted)}

/* rinks — the memorable bit: each game drawn as a strip of green */
.rinks{display:grid;gap:16px}
.rink{border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.rink-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surface)}
.rink-no{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 8px;border-radius:7px;background:var(--marker);color:#2a2100;font-family:Bitter,Georgia,serif;font-weight:800;margin-right:10px}
.rink-head strong{font-size:1.1rem}
.green{position:relative;display:grid;grid-template-columns:1fr 46px 1fr;gap:8px;align-items:center;padding:16px 12px;
  background:repeating-linear-gradient(90deg,var(--turf) 0 34px,var(--turf-2) 34px 68px);color:var(--on-turf)}
.team{background:rgba(255,255,255,.94);color:#16301f;border-radius:10px;padding:10px 12px;min-width:0}
.team.b{background:#f6ebe5;color:#3d2219}
.team h3{margin:0 0 4px;font-size:.85rem;font-weight:700;opacity:.7}
.team ol{margin:0;padding:0;list-style:none}
.team li{padding:2px 0;font-weight:700;overflow-wrap:anywhere}
.team li .star{color:#a07a00;font-weight:400}
.jack{justify-self:center;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(0,0,0,.15)}
.notes{margin-top:16px;display:grid;gap:8px}
.note{padding:10px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:.95rem}
.note.warn{border-color:var(--warn)}
.legend{color:var(--muted);font-size:.9rem;margin-top:10px}
.fresh{animation:pop .35s ease-out}
@keyframes pop{from{opacity:.2;transform:scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fresh{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
footer{color:var(--muted);font-size:.85rem;margin-top:18px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Bowls team selection</h1>
      <p class="sub" id="today"></p>
    </div>
  </header>

  <ol class="steps" aria-label="Progress">
    <li data-s="1"><b>1</b><span>Who's playing</span></li>
    <li data-s="2"><b>2</b><span>Choose games</span></li>
    <li data-s="3"><b>3</b><span>The draw</span></li>
  </ol>

  <!-- STEP 1 -->
  <section class="panel" id="step1">
    <h2>Who's playing today?</h2>
    <p class="sub">Tick everyone who's here and pick any game preference.</p>
    <div class="bar">
      <span class="count" id="count1"></span>
      <span><button class="link" id="allOn">Tick all</button> <button class="link" id="allOff">Untick all</button></span>
    </div>
    <div id="players"></div>
    <form class="add" id="addForm" onsubmit="return false">
      <input type="text" id="newName" placeholder="Add a player" aria-label="New player name" maxlength="40">
      <button class="btn ghost" id="addBtn" type="button">Add</button>
    </form>
    <div class="nav">
      <button class="link" id="resetList">Restore the original ten</button>
      <div class="right"><button class="btn" id="to2">Show game options</button></div>
    </div>
  </section>

  <!-- STEP 2 -->
  <section class="panel" id="step2" hidden>
    <h2>Choose the games</h2>
    <p class="sub" id="sum2"></p>
    <div class="opts">
      <label>Rinks available
        <select id="maxRinks">
          <option value="0">Any number</option>
          <option value="1">1</option><option value="2">2</option><option value="3">3</option>
          <option value="4">4</option><option value="5">5</option><option value="6">6</option>
        </select>
      </label>
      <label><input type="checkbox" id="allowSit"> Allow some players to sit out</label>
    </div>
    <div class="combos" id="combos" role="radiogroup" aria-label="Game combinations"></div>
    <div class="nav">
      <button class="btn ghost" id="back1">Back</button>
      <div class="right"><button class="btn" id="to3" disabled>Make the draw</button></div>
    </div>
  </section>

  <!-- STEP 3 -->
  <section class="panel" id="step3" hidden>
    <h2>Today's draw</h2>
    <p class="sub" id="sum3"></p>
    <div class="rinks" id="rinks" style="margin-top:14px"></div>
    <p class="legend">★ got their preferred game</p>
    <div class="notes" id="notes"></div>
    <div class="nav">
      <button class="btn ghost" id="back2">Back</button>
      <div class="right">
        <button class="btn ghost" id="copyBtn">Copy draw</button>
        <button class="btn" id="redraw">Reselect</button>
      </div>
    </div>
  </section>

  <footer>Your player list is remembered on this device.</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var KEY='bowls-players-v1';
  var DEFAULT=["Richard C","Jamie","Pat","Ann","Ken","Brenda","Terry","Christine","Richard G","Julia"];
  var TYPE={1:"Singles",2:"Pairs",3:"Threes",4:"Fours"};
  var $=function(s){return document.querySelector(s)};

  function defaults(){return DEFAULT.map(function(n){return {name:n,playing:true,pref:0}})}
  function load(){
    try{var s=localStorage.getItem(KEY);if(s){var p=JSON.parse(s);if(Array.isArray(p)&&p.length)return p;}}catch(e){}
    return defaults();
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(players))}catch(e){}}

  var players=load(), step=1, combos=[], chosenKey=null, lastSig=null, lastDraw=null;

  var dateStr=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  $('#today').textContent=dateStr;

  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function plural(n,w){return n+' '+w+(n===1?'':'s')}
  function playing(){return players.filter(function(p){return p.playing})}

  /* ---------- step navigation ---------- */
  function go(s){
    step=s;
    [1,2,3].forEach(function(i){$('#step'+i).hidden=(i!==s)});
    document.querySelectorAll('.steps li').forEach(function(li){
      var n=+li.dataset.s; li.className=n===s?'on':(n<s?'done':'');
    });
    if(s===2)renderCombos();
    if(s===3)makeDraw(true);
    window.scrollTo({top:0,behavior:'smooth'});
  }

  /* ---------- step 1 ---------- */
  function renderPlayers(){
    var box=$('#players');box.innerHTML='';
    players.forEach(function(p,i){
      var row=document.createElement('div');row.className='prow'+(p.playing?'':' off');
      var lab=document.createElement('label');lab.className='pname';
      var cb=document.createElement('input');cb.type='checkbox';cb.checked=p.playing;
      cb.setAttribute('aria-label',p.name+' is playing');
      var sp=document.createElement('span');sp.textContent=p.name;
      lab.appendChild(cb);lab.appendChild(sp);
      var sel=document.createElement('select');sel.setAttribute('aria-label','Preference for '+p.name);
      [0,1,2,3,4].forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=v?TYPE[v]:'No preference';if(+p.pref===v)o.selected=true;sel.appendChild(o)});
      var x=document.createElement('button');x.className='x';x.type='button';x.textContent='×';
      x.title='Remove '+p.name+' from the group';x.setAttribute('aria-label','Remove '+p.name);
      cb.onchange=function(){p.playing=cb.checked;row.className='prow'+(p.playing?'':' off');save();updateCount()};
      sel.onchange=function(){p.pref=+sel.value;save()};
      x.onclick=function(){players.splice(i,1);save();renderPlayers()};
      row.appendChild(lab);row.appendChild(sel);row.appendChild(x);box.appendChild(row);
    });
    updateCount();
  }
  function updateCount(){
    var n=playing().length;
    $('#count1').textContent=plural(n,'player')+' ticked';
    $('#to2').disabled=n<2;
  }
  function addPlayer(){
    var v=$('#newName').value.trim();if(!v)return;
    players.push({name:v,playing:true,pref:0});$('#newName').value='';save();renderPlayers();$('#newName').focus();
  }
  $('#addBtn').onclick=addPlayer;
  $('#newName').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();addPlayer()}});
  $('#allOn').onclick=function(){players.forEach(function(p){p.playing=true});save();renderPlayers()};
  $('#allOff').onclick=function(){players.forEach(function(p){p.playing=false});save();renderPlayers()};
  $('#resetList').onclick=function(){players=defaults();save();renderPlayers()};
  $('#to2').onclick=function(){go(2)};

  /* ---------- step 2 ---------- */
  // ways to split n "halves" (one player per side) into games of size 1-4
  function partitions(n,max){
    if(n===0)return [[]];
    var out=[];
    for(var p=Math.min(4,max,n);p>=1;p--){
      partitions(n-p,p).forEach(function(rest){out.push([p].concat(rest))});
    }
    return out;
  }
  function prefCounts(list){
    var c={1:0,2:0,3:0,4:0};list.forEach(function(p){if(p.pref)c[p.pref]++});return c;
  }
  function buildCombos(){
    var pl=playing(),N=pl.length,pc=prefCounts(pl);
    var wanted=pc[1]+pc[2]+pc[3]+pc[4];
    var allow=$('#allowSit').checked, maxR=+$('#maxRinks').value||99;
    var maxSit=allow?Math.min(3,N-2):(N%2);
    var list=[];
    for(var k=0;k<=maxSit;k++){
      var used=N-k; if(used<2||used%2)continue;
      partitions(used/2,4).forEach(function(parts){
        if(parts.length>maxR)return;
        var counts={};parts.forEach(function(t){counts[t]=(counts[t]||0)+1});
        var met=0;[1,2,3,4].forEach(function(t){met+=Math.min(pc[t],2*t*(counts[t]||0))});
        list.push({key:parts.join('-')+'/'+k,parts:parts,counts:counts,sit:k,used:used,games:parts.length,met:met,wanted:wanted});
      });
    }
    list.sort(function(a,b){return a.sit-b.sit||b.met-a.met||a.games-b.games});
    return list;
  }
  function comboName(c){
    return [4,3,2,1].filter(function(t){return c.counts[t]}).map(function(t){return c.counts[t]+' × '+TYPE[t]}).join(' + ');
  }
  function renderCombos(){
    var pl=playing(),N=pl.length,pc=prefCounts(pl);
    var prefTxt=[1,2,3,4].filter(function(t){return pc[t]}).map(function(t){return pc[t]+' want '+TYPE[t].toLowerCase()});
    $('#sum2').textContent=plural(N,'player')+' today'+(prefTxt.length?' ('+prefTxt.join(', ')+')':'')+'. Tick the set of games you want.';
    combos=buildCombos();
    var box=$('#combos');box.innerHTML='';
    if(!combos.length){
      var e=document.createElement('div');e.className='empty';
      e.textContent='No combinations fit. Try allowing more rinks or letting some players sit out.';
      box.appendChild(e);chosenKey=null;$('#to3').disabled=true;return;
    }
    if(!combos.some(function(c){return c.key===chosenKey}))chosenKey=null;
    combos.forEach(function(c,i){
      var lab=document.createElement('label');lab.className='combo'+(c.key===chosenKey?' sel':'');
      var r=document.createElement('input');r.type='checkbox';r.checked=c.key===chosenKey;
      var d=document.createElement('div');
      var w=document.createElement('div');w.className='what';w.textContent=comboName(c);
      if(i===0&&c.wanted>0){var b=document.createElement('span');b.className='badge';b.textContent='Best fit';w.appendChild(b)}
      var m=document.createElement('div');m.className='meta';
      m.textContent=plural(c.games,'game')+', '+(c.sit?c.used+' play and '+c.sit+' sit'+(c.sit===1?'s':'')+' out':'everyone plays');
      d.appendChild(w);d.appendChild(m);
      if(c.wanted){var pf=document.createElement('div');pf.className='pref';pf.textContent='Preferences met: '+c.met+' of '+c.wanted;d.appendChild(pf)}
      r.onchange=function(){chosenKey=r.checked?c.key:null;renderCombos()};
      lab.appendChild(r);lab.appendChild(d);box.appendChild(lab);
    });
    $('#to3').disabled=!chosenKey;
  }
  $('#maxRinks').onchange=renderCombos;
  $('#allowSit').onchange=renderCombos;
  $('#back1').onclick=function(){go(1)};
  $('#to3').onclick=function(){if(chosenKey){lastSig=null;go(3)}};

  /* ---------- step 3 ---------- */
  function drawOnce(c){
    var pl=shuffle(playing());
    var cap={1:0,2:0,3:0,4:0};c.parts.forEach(function(t){cap[t]+=2*t});
    var placed={1:[],2:[],3:[],4:[]},left=[],unmet=[];
    // players with a preference fill those places first
    pl.forEach(function(p){
      if(p.pref&&placed[p.pref].length<cap[p.pref])placed[p.pref].push(p);
      else{left.push(p);if(p.pref)unmet.push(p)}
    });
    left=shuffle(left);
    var free=[];[1,2,3,4].forEach(function(t){for(var k=placed[t].length;k<cap[t];k++)free.push(t)});
    free=shuffle(free);
    left.forEach(function(p,i){if(i<free.length)placed[free[i]].push(p)});
    var sitting=left.slice(free.length);
    var matches=[];
    [4,3,2,1].forEach(function(t){
      var pool=shuffle(placed[t]),n=c.counts[t]||0;
      for(var m=0;m<n;m++){var g=pool.slice(m*2*t,(m+1)*2*t);matches.push({type:t,a:g.slice(0,t),b:g.slice(t)})}
    });
    // rinks in random order too
    matches=shuffle(matches);
    return {matches:matches,sitting:sitting,unmet:unmet};
  }
  function sig(d){
    return d.matches.map(function(m){
      var a=m.a.map(function(p){return p.name}).sort().join(','),b=m.b.map(function(p){return p.name}).sort().join(',');
      return m.type+':'+[a,b].sort().join('|');
    }).sort().join(';');
  }
  function makeDraw(first){
    var c=combos.find(function(x){return x.key===chosenKey});if(!c)return go(2);
    var d,tries=0;
    do{d=drawOnce(c);tries++}while(sig(d)===lastSig&&tries<40);
    lastSig=sig(d);lastDraw={d:d,c:c};
    renderDraw(d,c,!first);
  }
  function teamBox(cls,label,list,type){
    var t=document.createElement('div');t.className='team '+cls;
    var h=document.createElement('h3');h.textContent=label;t.appendChild(h);
    var ol=document.createElement('ol');
    list.forEach(function(p){
      var li=document.createElement('li');li.textContent=p.name;
      if(+p.pref===type){var s=document.createElement('span');s.className='star';s.textContent=' ★';s.setAttribute('aria-label','got preference');li.appendChild(s)}
      ol.appendChild(li);
    });
    t.appendChild(ol);return t;
  }
  function renderDraw(d,c,animate){
    $('#sum3').textContent=comboName(c)+'. Not happy? Press Reselect for a fresh draw.';
    var box=$('#rinks');box.innerHTML='';
    d.matches.forEach(function(m,i){
      var r=document.createElement('div');r.className='rink'+(animate?' fresh':'');
      var h=document.createElement('div');h.className='rink-head';
      var l=document.createElement('div');
      var no=document.createElement('span');no.className='rink-no';no.textContent=i+1;
      var st=document.createElement('strong');st.textContent=TYPE[m.type];
      l.appendChild(no);l.appendChild(st);
      var vs=document.createElement('span');vs.style.color='var(--muted)';vs.textContent=m.type+' v '+m.type;
      h.appendChild(l);h.appendChild(vs);
      var g=document.createElement('div');g.className='green';
      g.appendChild(teamBox('a','Team A',m.a,m.type));
      var j=document.createElement('div');j.className='jack';j.setAttribute('aria-hidden','true');g.appendChild(j);
      g.appendChild(teamBox('b','Team B',m.b,m.type));
      r.appendChild(h);r.appendChild(g);box.appendChild(r);
    });
    var n=$('#notes');n.innerHTML='';
    if(d.sitting.length){
      var s=document.createElement('div');s.className='note';
      s.textContent='Sitting out: '+d.sitting.map(function(p){return p.name}).join(', ');n.appendChild(s);
    }
    if(d.unmet.length){
      var u=document.createElement('div');u.className='note warn';
      u.textContent='Couldn\u2019t give a preference to: '+d.unmet.map(function(p){return p.name+' (wanted '+TYPE[p.pref].toLowerCase()+')'}).join(', ');
      n.appendChild(u);
    }
  }
  function drawText(){
    if(!lastDraw)return '';
    var d=lastDraw.d,lines=['Bowls \u2013 '+dateStr,''];
    d.matches.forEach(function(m,i){
      lines.push('Rink '+(i+1)+' \u2013 '+TYPE[m.type]);
      lines.push('  '+m.a.map(function(p){return p.name}).join(', '));
      lines.push('  v');
      lines.push('  '+m.b.map(function(p){return p.name}).join(', '));
      lines.push('');
    });
    if(d.sitting.length)lines.push('Sitting out: '+d.sitting.map(function(p){return p.name}).join(', '));
    return lines.join('\n').trim();
  }
  function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1800)}
  $('#copyBtn').onclick=function(){
    var txt=drawText();
    function fallback(){
      try{var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
        var ok=document.execCommand('copy');document.body.removeChild(ta);toast(ok?'Draw copied':'Copy didn\u2019t work on this device');}
      catch(e){toast('Copy didn\u2019t work on this device')}
    }
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('Draw copied')},fallback)}
      else fallback();
    }catch(e){fallback()}
  };
  $('#redraw').onclick=function(){makeDraw(false)};
  $('#back2').onclick=function(){go(2)};

  renderPlayers();go(1);
})();
</script>
</body>
</html>
