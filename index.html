<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team selection</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ec;--ink:#17291f;--muted:#55665b;--card:#fff;--line:#cdd8cf}
@media (prefers-color-scheme:dark){:root{--bg:#111713;--ink:#e7eee8;--muted:#9fb0a4;--card:#1a231d;--line:#2e3b32}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:18px;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:560px;margin:0 auto;padding:40px 18px}
h1{font-family:Bitter,Georgia,serif;font-weight:800;font-size:2rem;margin:0 0 6px}
p{color:var(--muted);margin:0 0 24px}
a{display:flex;align-items:center;gap:16px;padding:18px;margin-bottom:12px;border-radius:14px;background:var(--card);
  border:1px solid var(--line);color:inherit;text-decoration:none;font-weight:700;font-size:1.2rem}
a:hover{border-color:currentColor}
a span{font-size:1.8rem}
</style>
</head>
<body>
<main>
  <h1>Team selection</h1>
  <p>Pick who's playing and get a fair, random draw.</p>
  <a href="bowls.html"><span aria-hidden="true">🟢</span>Bowls</a>
  <a href="tennis.html"><span aria-hidden="true">🎾</span>Tennis</a>
</main>
</body>
</html>
